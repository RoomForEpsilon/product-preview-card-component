<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <meta name="description" content="This is my solution to the product preview card componenet challenge on FrontendMentor."> 
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  <main>
    <article>
      <picture>
        <source 
          media="(width >= 616px)" 
          srcset="./images/image-product-desktop.jpg">
        <img 
          src="./images/image-product-mobile.jpg" 
          alt="A Bottle of Eau De Parfum"
          width="700"
          height="684"
          class="card-image">
      </picture>
      <p class="text-preset-4 product-category">Perfume</p>

      <h1 class="text-preset-1 product-title">Gabrielle Essence Eau De Parfum</h1>

      <p class="text-preset-3 product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>
      <span class="prices">
        <span class="text-preset-1 sale-price">$149.99</span>
        <span class="text-preset-5 regular-price">$169.99</span>
        </span>
      <button 
        class="text-preset-2 add-to-cart-button">
        <img 
          src="./images/icon-cart.svg" 
          class="button-image">
        Add to Cart
      </button>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/RoomForEpsilon">John</a>.
  </footer>
</body>
</html>
